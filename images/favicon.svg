<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#161d2f"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="40%" stop-color="#e5b958"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#e5b958" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- 빛나는 ✦ 시네마틱 심볼 -->
  <path d="M32 8 C32 20 20 32 8 32 C20 32 32 44 32 56 C32 44 44 32 56 32 C44 32 32 20 32 8 Z" 
        fill="url(#starGrad)" 
        filter="url(#glow)"/>

  <!-- 중앙 하이라이트 코어 -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" opacity="0.9"/>
</svg>
